# ==============================================================================
# Supabase Configuration for E-Lanka Digital Democracy Platform
# ==============================================================================

project_id = "e-lanka-democracy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
port = 54324
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://democracy.elanka.gov.lk"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = false

[analytics]
enabled = false

