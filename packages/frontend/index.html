<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#8D153A" />
    <meta name="description" content="E-Lanka Digital Democracy Platform - Trilingual civic engagement, policy consultations, e-petitions, and PDPA No. 9 of 2022 compliant citizen participation." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>E-Lanka Digital Democracy Platform | ඊ-ලංකා | ஈ-இலங்கை</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-lanka-gold/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for ultra-low bandwidth offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] ServiceWorker registered with scope:', reg.scope))
            .catch(err => console.log('[PWA] ServiceWorker registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
